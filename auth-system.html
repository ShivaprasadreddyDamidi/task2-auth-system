<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Authentication System | Shivaprasad</title>

<!-- Bootstrap CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>

body{
  background: linear-gradient(to right,#141e30,#243b55);
  font-family: 'Poppins', sans-serif;
}

.auth-box{
  background:white;
  max-width:420px;
  margin:auto;
  margin-top:80px;
  padding:30px;
  border-radius:12px;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
  animation: fade 0.7s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1;}
}

.hidden{
  display:none;
}

h3{
  color:#243b55;
}

input{
  border-radius:6px;
}

.btn-main{
  background:#243b55;
  color:white;
}

.btn-main:hover{
  background:#141e30;
}

.footer{
  text-align:center;
  color:white;
  margin-top:30px;
  font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="auth-box">

<!-- LOGIN -->
<div id="loginBox">

<h3 class="text-center mb-3">Login</h3>

<form onsubmit="return loginValidate()">

<input type="email" id="loginEmail" class="form-control mb-3" placeholder="Email">

<input type="password" id="loginPass" class="form-control mb-3" placeholder="Password">

<button class="btn btn-main w-100">Login</button>

<p class="text-center mt-3">
No account?
<a href="#" onclick="showRegister()">Register</a>
</p>

</form>

<p id="loginMsg" class="text-center"></p>

</div>


<!-- REGISTER -->
<div id="registerBox" class="hidden">

<h3 class="text-center mb-3">Register</h3>

<form onsubmit="return registerValidate()">

<input type="text" id="name" class="form-control mb-3" placeholder="Full Name">

<input type="email" id="regEmail" class="form-control mb-3" placeholder="Email">

<input type="password" id="regPass" class="form-control mb-3" placeholder="Password">

<input type="password" id="regCpass" class="form-control mb-3" placeholder="Confirm Password">

<button class="btn btn-success w-100">Register</button>

<p class="text-center mt-3">
Already registered?
<a href="#" onclick="showLogin()">Login</a>
</p>

</form>

<p id="regMsg" class="text-center"></p>

</div>

</div>

<div class="footer">
© 2026 Shivaprasad Damidi | Internship Task-2
</div>

</div>

<script>

function showRegister(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.remove("hidden");
}

function showLogin(){
  document.getElementById("registerBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}


// Login Validation
function loginValidate(){

let email=document.getElementById("loginEmail").value.trim();
let pass=document.getElementById("loginPass").value.trim();
let msg=document.getElementById("loginMsg");

if(email==""||pass==""){
msg.style.color="red";
msg.innerText="All fields required!";
return false;
}

if(!email.includes("@")){
msg.style.color="red";
msg.innerText="Invalid email format!";
return false;
}

msg.style.color="green";
msg.innerText="Login successful (Demo Mode)";
return false;
}


// Register Validation
function registerValidate(){

let name=document.getElementById("name").value.trim();
let email=document.getElementById("regEmail").value.trim();
let pass=document.getElementById("regPass").value.trim();
let cpass=document.getElementById("regCpass").value.trim();
let msg=document.getElementById("regMsg");

if(name==""||email==""||pass==""||cpass==""){
msg.style.color="red";
msg.innerText="All fields required!";
return false;
}

if(pass.length<6){
msg.style.color="red";
msg.innerText="Password must be 6+ characters!";
return false;
}

if(pass!==cpass){
msg.style.color="red";
msg.innerText="Passwords do not match!";
return false;
}

msg.style.color="green";
msg.innerText="Registration successful (Demo Mode)";
return false;
}


  
</script>

</body>
</html>
